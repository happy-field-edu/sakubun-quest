<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101a35">
<title>作文マスター・クエスト</title>
<style>
/* =========================================================
   作文マスター・クエスト  style.css
   - 小学2年生向け / iPad Safari で使いやすいこと を優先
   - 色や大きさは :root の変数でまとめて変えられる
   ========================================================= */

:root{
  /* せかいの色 */
  --bg-1:#101a35;
  --bg-2:#1d2b57;
  --panel:#fff8ea;         /* 羊皮紙（ようひし）色 */
  --panel-line:#c9ad7c;
  --ink:#3b2f22;           /* 文字色 */
  --ink-soft:#7a6a55;
  --gold:#ffcc44;
  --ok:#2fae63;
  --ok-soft:#d9f5e3;
  --ng:#ff9350;            /* こわくない オレンジ */
  --ng-soft:#ffeadd;
  --white:#ffffff;

  /* ワールドの色（JSで --w にセットする） */
  --w:#3fa96a;

  /* 大きさ */
  --radius:18px;
  --tap:56px;              /* タップしやすい 最小の大きさ */
  --topbar-h:52px;
  --cell:30px;             /* げんこう用紙の1マス（JSで計算しなおす） */

  --font: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4", "UD デジタル 教科書体 NK-R",
          "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
}

*{ box-sizing:border-box; }
/* hidden ぞくせいを かならず ゆうせんする（display を うわがき されないように） */
[hidden]{ display:none !important; }

html,body{
  margin:0; padding:0;
  height:100%;
  font-family:var(--font);
  color:var(--ink);
  background:var(--bg-1);
  -webkit-text-size-adjust:100%;
}
body{
  background:
    radial-gradient(circle at 12% 12%, rgba(255,255,255,.10) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 22%, rgba(255,255,255,.10) 0 2px, transparent 3px),
    radial-gradient(circle at 30% 78%, rgba(255,255,255,.08) 0 2px, transparent 3px),
    radial-gradient(circle at 68% 62%, rgba(255,255,255,.08) 0 2px, transparent 3px),
    linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%, #2a1c46);
  background-attachment:fixed;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  overflow-x:hidden;
}

ruby rt{ font-size:.5em; font-weight:700; letter-spacing:0; }

/* ============ 上のバー ============ */
#topbar{
  position:sticky; top:0; z-index:50;
  height:calc(var(--topbar-h) + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  display:flex; align-items:center; gap:8px;
  padding-left:8px; padding-right:8px;
  background:rgba(16,26,53,.86);
  backdrop-filter:blur(8px);
  border-bottom:2px solid rgba(255,204,68,.35);
}
#tb-title{
  flex:1; text-align:center; color:var(--gold);
  font-weight:800; font-size:clamp(14px,3.6vw,18px); letter-spacing:.02em;
  text-shadow:0 2px 0 rgba(0,0,0,.4);
}
.tb-btn{
  min-width:44px; height:38px;
  border:0; border-radius:12px;
  background:rgba(255,255,255,.14); color:#fff;
  font-size:18px; font-family:inherit; font-weight:700;
  cursor:pointer;
}
.tb-btn:active{ transform:translateY(2px); }
#tb-power{
  color:var(--gold); font-weight:800; font-size:16px;
  background:rgba(0,0,0,.25); border-radius:999px; padding:4px 12px;
  min-width:60px; text-align:center;
}
#btn-back{ visibility:hidden; }
#btn-back.is-on{ visibility:visible; }

/* ============ 画面 ============ */
#main{
  max-width:900px; margin:0 auto;
  padding:14px 14px calc(30px + env(safe-area-inset-bottom));
}
.screen{ display:none; }
.screen.is-active{ display:block; animation:fadeUp .28s ease both; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }

/* ============ ボタン ============ */
.btn{
  display:block; width:100%;
  min-height:var(--tap);
  margin:10px 0; padding:12px 16px;
  font-family:inherit; font-size:clamp(16px,4.2vw,20px); font-weight:800;
  color:var(--ink); background:var(--panel);
  border:3px solid var(--panel-line); border-radius:var(--radius);
  box-shadow:0 5px 0 rgba(0,0,0,.35);
  cursor:pointer; line-height:1.5;
}
.btn:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
.btn-main{
  background:linear-gradient(180deg,#ffdd77,var(--gold));
  border-color:#b98b1d;
}
.btn:disabled{ opacity:.5; }
.btn-link{
  display:block; margin:18px auto 0; padding:8px;
  background:none; border:0; color:rgba(255,255,255,.6);
  font-family:inherit; font-size:14px; text-decoration:underline; cursor:pointer;
}

/* ============ タイトル画面 ============ */
.title-wrap{ text-align:center; padding-top:6px; }
.title-badge{ font-size:54px; filter:drop-shadow(0 6px 8px rgba(0,0,0,.5)); animation:bob 2.6s ease-in-out infinite; }
@keyframes bob{ 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
.game-title{
  margin:4px 0 6px;
  font-size:clamp(30px,9vw,52px); font-weight:900; line-height:1.15;
  color:var(--gold);
  text-shadow:0 3px 0 #8a5a00, 0 6px 14px rgba(0,0,0,.55);
}
.game-title .quest{ color:#fff; text-shadow:0 3px 0 #29508f, 0 6px 14px rgba(0,0,0,.55); }
.title-sub{ color:#e7ecff; font-size:clamp(14px,3.8vw,17px); font-weight:700; line-height:1.9; margin:0 0 10px; }
.title-chars{ display:flex; align-items:center; justify-content:center; gap:14px; margin:6px 0 14px; }
.title-chars .tc{ font-size:46px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
.title-chars .tc-boss{ animation:bob 1.8s ease-in-out infinite; }
.tc-vs{ color:#fff; font-weight:900; font-size:20px; opacity:.8; }
.title-btns{ max-width:420px; margin:0 auto; }

/* ============ はかせの ふきだし ============ */
.talk-bar{
  display:flex; align-items:flex-start; gap:10px;
  background:var(--panel); border:3px solid var(--panel-line);
  border-radius:var(--radius); padding:10px 14px; margin:0 0 12px;
  box-shadow:0 4px 0 rgba(0,0,0,.3);
}
.talk-bar--in{ box-shadow:none; margin:12px 0 0; }
.talk-face{ font-size:30px; line-height:1.2; flex:none; }
.talk-text{ margin:0; font-size:clamp(15px,4vw,18px); font-weight:700; line-height:1.7; }

/* ============ ワールド一覧 ============ */
.world-list{ display:grid; gap:12px; }
.world-card{
  position:relative; display:flex; align-items:center; gap:12px;
  width:100%; text-align:left;
  padding:14px; min-height:88px;
  background:var(--panel); border:3px solid var(--panel-line);
  border-left:12px solid var(--w);
  border-radius:var(--radius); box-shadow:0 5px 0 rgba(0,0,0,.35);
  font-family:inherit; cursor:pointer;
}
.world-card:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.35); }
.wc-emoji{ font-size:38px; flex:none; }
.wc-main{ flex:1; min-width:0; }
.wc-no{ font-size:12px; font-weight:800; color:#fff; background:var(--w); border-radius:999px; padding:2px 10px; display:inline-block; }
.wc-name{ font-size:clamp(17px,4.6vw,22px); font-weight:900; margin:4px 0 2px; }
.wc-theme{ font-size:13px; color:var(--ink-soft); font-weight:700; }
.wc-stars{ font-size:17px; letter-spacing:1px; color:var(--gold); text-shadow:0 1px 0 rgba(0,0,0,.25); }
.wc-clear{
  position:absolute; top:8px; right:10px;
  font-size:12px; font-weight:900; color:#fff; background:var(--ok);
  border-radius:999px; padding:3px 10px;
}

/* ============ バトル ============ */
#battle-head{ margin-bottom:12px; }
.enemy-box{
  display:flex; align-items:center; gap:12px;
  background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
  border:3px solid rgba(255,255,255,.25); border-radius:var(--radius);
  padding:10px 14px;
}
.enemy-face{ font-size:46px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.5)); }
.enemy-face.is-hit{ animation:shake .45s ease; }
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(0);}
  20%{transform:translateX(-9px) rotate(-8deg);}
  45%{transform:translateX(8px) rotate(7deg);}
  70%{transform:translateX(-5px) rotate(-4deg);}
}
.enemy-info{ flex:1; min-width:0; }
.enemy-name{ color:#fff; font-weight:900; font-size:clamp(15px,4vw,19px); margin-bottom:6px; }
.hp-bar{ height:16px; background:rgba(0,0,0,.45); border-radius:999px; overflow:hidden; border:2px solid rgba(255,255,255,.35); }
.hp-fill{ height:100%; width:100%; border-radius:999px; background:linear-gradient(90deg,#ff6b6b,#ffb03a); transition:width .5s cubic-bezier(.3,1.4,.5,1); }
.q-count{ text-align:right; color:#cfd8f5; font-size:13px; font-weight:800; margin-top:6px; }

.q-body{ margin:0 0 14px; }
.answers{ display:grid; gap:10px; }

/* こたえの ボタン */
.ans{
  position:relative; width:100%;
  min-height:var(--tap); padding:14px 16px 14px 52px;
  text-align:left; font-family:inherit;
  font-size:clamp(15px,4.2vw,19px); font-weight:800; line-height:1.7;
  color:var(--ink); background:var(--panel);
  border:3px solid var(--panel-line); border-radius:var(--radius);
  box-shadow:0 5px 0 rgba(0,0,0,.3); cursor:pointer;
}
.ans:active{ transform:translateY(4px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
.ans .ans-mark{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; border-radius:50%;
  background:var(--w); color:#fff; font-size:15px; font-weight:900;
  display:flex; align-items:center; justify-content:center;
}
.ans.is-ng{ background:#efe7dc; color:#9b8f80; box-shadow:none; transform:translateY(4px); }
.ans.is-ng .ans-mark{ background:#b9ada0; }
.ans.is-ok{ background:var(--ok-soft); border-color:var(--ok); }
.ans.wrong-shake{ animation:shake .4s ease; }
.ans-genkou{ padding:12px 12px 12px 52px; }

/* ○× */
.ox-wrap{ display:flex; gap:14px; }
.ox{
  flex:1; min-height:96px; border-radius:24px;
  border:4px solid var(--panel-line); background:var(--panel);
  font-size:52px; font-weight:900; font-family:inherit; color:var(--ink);
  box-shadow:0 6px 0 rgba(0,0,0,.3); cursor:pointer;
}
.ox:active{ transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
.ox.o{ color:#e2555f; }
.ox.x{ color:#4a7bd0; }
.ox.is-ng{ opacity:.4; }
.statement{
  background:var(--panel); border:3px dashed var(--panel-line); border-radius:var(--radius);
  padding:16px; margin:0 0 14px;
  font-size:clamp(16px,4.6vw,21px); font-weight:800; line-height:1.9; text-align:center;
}

/* 「、」を入れる場所（スロット） */
.slot-sentence{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
  gap:2px; background:var(--panel); border:3px solid var(--panel-line);
  border-radius:var(--radius); padding:16px 10px;
  font-size:clamp(17px,4.6vw,22px); font-weight:800; line-height:2;
}
.slot-btn{
  width:42px; height:50px; border-radius:10px;
  border:3px dashed #bda67c; background:#fffdf6;
  color:#c0a878; font-size:20px; font-weight:900; font-family:inherit; cursor:pointer;
}
.slot-btn:active{ transform:translateY(3px); }
.slot-btn.is-ok{ background:var(--ok-soft); border-style:solid; border-color:var(--ok); color:var(--ok); }
.slot-btn.is-ng{ opacity:.35; }

/* ならべかえ */
.order-slots{ display:flex; gap:8px; margin-bottom:12px; }
.order-slot{
  flex:1; min-height:48px; border-radius:14px;
  border:3px dashed rgba(255,255,255,.4); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:13px; font-weight:800; padding:6px; text-align:center; line-height:1.4;
}
.order-slot.is-filled{ background:var(--panel); color:var(--ink); border-style:solid; border-color:var(--panel-line); }
.order-num{ font-size:11px; opacity:.7; display:block; }
.ans.is-picked{ opacity:.35; }

/* ============ げんこう用紙（たて書き） ============ */
/* 行は 右から 左へ、字は 上から 下へ ならぶ 本ものの げんこう用紙と 同じならび */
.genkou-wrap{ display:flex; justify-content:center; }
.genkou{
  display:grid;
  direction:rtl;                                        /* 行を 右から 左へ */
  grid-auto-flow:column;                                /* 字を 上から 下へ */
  grid-template-rows:repeat(var(--chars), var(--cell)); /* 1行の 文字数 */
  grid-auto-columns:var(--cell);
  background:#fffdf5;
  border:3px solid #b8985f; border-radius:8px;
  padding:4px;
  box-shadow:0 5px 0 rgba(0,0,0,.3);
}
.gcell{
  direction:ltr;
  writing-mode:vertical-rl;                             /* マスの中の字も たて書き */
  text-orientation:mixed;
  width:var(--cell); height:var(--cell);
  border:1px solid #e3d3ae;
  display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--cell) * .68); font-weight:700; line-height:1;
  color:var(--ink);
}
.gcell .gc-main{ display:block; }
.gcell .gc-sub{ font-size:.6em; }
/* 「、」「。」や 小さい字は マスの 右上に よせる（たて書きの きまり） */
.gcell.k-punct, .gcell.k-small{ align-items:flex-start; justify-content:flex-start; }
/* 行の さいごの 字と 同じマスに 入った 句読点（ぶら下がり）
   字は すこし 上へ、句読点は その 下（マスの 右下）に 小さく そえる。
   たて書きの「。」は 字の 右上に えがかれるので、
   その ぶん 下へ ずらして 字の 下に くるようにする。 */
.gcell.k-tail{ position:relative; }
.gcell.k-tail .gc-main{ transform:translateY(-11%); }
.gcell.k-tail .gc-sub{
  position:absolute; right:0; bottom:-19%;
  font-size:.6em; line-height:1;
}
/* 「。」と とじかっこが 同じマスに 入った ばあい */
.gcell.k-pair{ font-size:calc(var(--cell) * .46); }
.gcell.k-pair .gc-sub{ font-size:1em; }
/* タップできる マス */
.gcell.tapable{ cursor:pointer; }
.gcell.tapable:active{ background:#fff2c9; }
.gcell.hit{ background:var(--ok-soft); box-shadow:inset 0 0 0 3px var(--ok); }
.gcell.miss{ animation:cellmiss .4s ease; }
@keyframes cellmiss{ 0%,100%{background:#fffdf5;} 40%{background:var(--ng-soft);} }
.gcell.mark{ box-shadow:inset 0 0 0 3px var(--gold); }
.genkou.is-locked .gcell.tapable{ cursor:default; }
.genkou-box{ display:block; }
.genkou-label{
  text-align:center; color:#fff; font-size:12px; font-weight:800;
  margin-bottom:6px; opacity:.85;
}

/* くらべる（正しい・まちがい） */
.compare{ display:grid; gap:10px; }
.cmp-box{ background:var(--panel); border:3px solid var(--panel-line); border-radius:14px; padding:10px 12px; }
.cmp-box.ok{ border-color:var(--ok); background:var(--ok-soft); }
.cmp-box.ng{ border-color:var(--ng); background:var(--ng-soft); }
.cmp-tag{ font-size:12px; font-weight:900; margin-bottom:4px; }
.cmp-box.ok .cmp-tag{ color:#1c7a44; }
.cmp-box.ng .cmp-tag{ color:#c05a1c; }
.cmp-text{ font-size:clamp(15px,4.2vw,19px); font-weight:800; line-height:1.8; white-space:pre-wrap; }

/* ============ こたえ合わせパネル ============ */
.verdict{
  position:fixed; inset:0; z-index:60;
  background:rgba(10,16,34,.72);
  display:flex; align-items:flex-end; justify-content:center;
  padding:10px; overflow-y:auto;
  animation:fadeUp .2s ease both;
}
.verdict-inner{
  width:100%; max-width:640px;
  background:var(--panel); border:4px solid var(--panel-line);
  border-radius:24px; padding:16px;
  box-shadow:0 -6px 30px rgba(0,0,0,.5);
  margin:auto 0 0;
  animation:slideUp .3s cubic-bezier(.2,1.2,.4,1) both;
}
@keyframes slideUp{ from{transform:translateY(40px); opacity:0;} to{transform:none; opacity:1;} }
.verdict-title{ text-align:center; font-size:clamp(22px,6vw,30px); font-weight:900; color:var(--ok); margin-bottom:8px; }
.verdict-rule{
  background:#fff; border:2px solid var(--panel-line); border-radius:12px;
  padding:8px 12px; font-size:14px; font-weight:800; color:var(--ink-soft);
  margin-bottom:10px; text-align:center;
}
.verdict-compare{ margin-bottom:4px; }
#btn-next{ margin-top:14px; }

/* ============ 演出 ============ */
#fx-layer{ position:fixed; inset:0; pointer-events:none; z-index:70; overflow:hidden; }
.spark{ position:absolute; font-size:26px; animation:sparkUp 1s ease-out forwards; }
@keyframes sparkUp{
  0%{ transform:translate(0,0) scale(.4); opacity:0; }
  25%{ opacity:1; }
  100%{ transform:translate(var(--dx), var(--dy)) scale(1.3) rotate(var(--rot)); opacity:0; }
}
.dmg{
  position:absolute; font-size:30px; font-weight:900; color:#fff;
  text-shadow:0 3px 0 #c33, 0 0 12px rgba(255,80,80,.9);
  animation:dmgUp 1s ease-out forwards;
}
@keyframes dmgUp{
  0%{ transform:translate(-50%,0) scale(.6); opacity:0; }
  20%{ transform:translate(-50%,-14px) scale(1.25); opacity:1; }
  100%{ transform:translate(-50%,-70px) scale(1); opacity:0; }
}
.flash{
  position:fixed; inset:0; z-index:80; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
}
.flash span{
  font-size:clamp(34px,11vw,64px); font-weight:900; color:#fff;
  text-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 22px var(--gold);
  animation:pop .9s cubic-bezier(.2,1.6,.4,1) forwards;
}
.flash.ng span{ text-shadow:0 4px 0 rgba(0,0,0,.35), 0 0 22px var(--ng); }
@keyframes pop{
  0%{ transform:scale(.3) rotate(-8deg); opacity:0; }
  25%{ transform:scale(1.15) rotate(2deg); opacity:1; }
  70%{ transform:scale(1) rotate(0); opacity:1; }
  100%{ transform:scale(1.05); opacity:0; }
}

/* ============ けっか画面 ============ */
.result-body{ text-align:center; }
.result-emoji{ font-size:64px; animation:bob 2s ease-in-out infinite; }
.result-title{ font-size:clamp(24px,7vw,36px); font-weight:900; color:var(--gold); text-shadow:0 3px 0 #8a5a00; margin:6px 0; }
.result-stars{ font-size:clamp(32px,9vw,46px); letter-spacing:4px; color:var(--gold); margin:4px 0 10px; text-shadow:0 2px 0 rgba(0,0,0,.3); }
.result-panel{
  background:var(--panel); border:3px solid var(--panel-line); border-radius:var(--radius);
  padding:14px; margin:0 auto 14px; max-width:480px; text-align:left;
}
.result-row{ display:flex; justify-content:space-between; font-size:16px; font-weight:800; padding:6px 0; border-bottom:2px dotted #e0d2b4; }
.result-row:last-child{ border:0; }
.result-btns{ max-width:420px; margin:0 auto; }

/* ============ 作文チェック ============ */
.sample-box{ margin-bottom:12px; }
.sample-toggle{
  width:100%; min-height:48px; padding:10px 14px;
  font-family:inherit; font-size:clamp(14px,3.8vw,17px); font-weight:800;
  color:#fff; background:rgba(255,255,255,.14);
  border:2px solid rgba(255,255,255,.3); border-radius:14px; cursor:pointer;
}
.sample-toggle:active{ transform:translateY(2px); }
.sample-body{ margin-top:10px; }
.sample-body{ display:block; }
.check-meter{ height:18px; background:rgba(0,0,0,.35); border:2px solid rgba(255,255,255,.3); border-radius:999px; overflow:hidden; margin-bottom:12px; }
.check-meter-fill{ height:100%; width:0%; background:linear-gradient(90deg,#6ee7a6,var(--gold)); transition:width .4s ease; }
.check-list{ display:grid; gap:10px; }
.check-item{
  display:flex; align-items:center; gap:12px;
  width:100%; padding:12px 14px; min-height:var(--tap);
  background:var(--panel); border:3px solid var(--panel-line); border-radius:var(--radius);
  box-shadow:0 4px 0 rgba(0,0,0,.3);
  font-family:inherit; font-size:clamp(15px,4.2vw,18px); font-weight:800; text-align:left;
  color:var(--ink); cursor:pointer; line-height:1.6;
}
.check-item:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
.check-box{
  flex:none; width:34px; height:34px; border-radius:10px;
  border:3px solid var(--panel-line); background:#fff;
  display:flex; align-items:center; justify-content:center; font-size:22px; color:transparent;
}

/* ========== 0. ちいさな どうぐ ========== */
const $  = (id) => document.getElementById(id);
const ce = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));

/* ========== 1. セーブデータ（LocalStorage） ========== */
const SAVE_KEY = 'sakubun-quest-v1';

function blankSave() {
  return {
    version: 1,
    power: 0,          // 作文パワー
    worlds: {},        // w1:{ cleared:true, stars:3, first:6, total:7 }
    categories: {},    // genkou:{ first:5, total:7 }
    check: {},         // 作文チェックの チェック じょうたい
    sound: true
  };
}
let save = loadSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) return Object.assign(blankSave(), JSON.parse(raw));
  } catch (e) { /* つかえない ときは 何もしない */ }
  return blankSave();
}
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function addPower(n) {
  save.power += n;
  $('power-num').textContent = save.power;
  persist();
}
/* カテゴリ（身につき度）の きろく */
function bumpCategory(cat, first) {
  const c = save.categories[cat] || (save.categories[cat] = { first: 0, total: 0 });
  c.total++;
  if (first) c.first++;
  persist();
}
/* 星の 計算：一回で 正かい できた わりあい */
function starsFor(first, total) {
  if (!total) return 0;
  const r = first / total;
  if (r >= 0.95) return 5;
  if (r >= 0.8)  return 4;
  if (r >= 0.6)  return 3;
  if (r >= 0.4)  return 2;
  return 1;
}
const starStr = (n) => '★'.repeat(n) + '☆'.repeat(5 - n);
const totalStars = () => WORLDS.reduce((s, w) => s + ((save.worlds[w.id] || {}).stars || 0), 0);

/* ========== 2. 音（がいぶファイル なしの かんたんな音） ========== */
const Sound = {
  ctx: null,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  tone(freq, t0, dur, type, vol) {
    if (!save.sound || !this.ctx) return;
    const ctx = this.ctx, now = ctx.currentTime + t0;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol || 0.12, now + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(now); o.stop(now + dur + 0.03);
  },
  tap()  { this.tone(720, 0, 0.08, 'sine', 0.07); },
  ok()   { this.tone(880, 0, 0.12); this.tone(1320, 0.09, 0.2); },
  ng()   { this.tone(320, 0, 0.16, 'triangle', 0.09); },
  win()  { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, i * 0.12, 0.32)); }
};

/* ========== 3. がめんの きりかえ ========== */
const SCREENS = ['title', 'map', 'battle', 'result', 'check', 'record'];
let current = 'title';

function go(name) {
  SCREENS.forEach(s => $('screen-' + s).classList.toggle('is-active', s === name));
  current = name;
  $('btn-back').classList.toggle('is-on', name !== 'title');
  window.scrollTo(0, 0);
  if (name === 'map')    renderMap();
  if (name === 'check')  renderCheck();
  if (name === 'record') renderRecord();
  if (name !== 'battle') { document.body.style.removeProperty('--w'); hideVerdict(); }
  requestAnimationFrame(fitAllGenkou);
}
function back() {
  if (current === 'battle') { hideVerdict(); go('map'); return; }
  if (current === 'result') { go('map'); return; }
  go('title');
}

/* ========== 4. げんこう用紙 びょうが ========== */
const RE_PUNCT = /[、。]/;
const RE_SMALL = /[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ]/;

/* 1行の 文字を マスに 分ける
   ・行の さいごに あふれた「、」「。」は 前の字と 同じマスへ
   ・「。」の あとの「」」も 同じマスへ                        */
function rowToCells(row, cols, merge) {
  const cells = [];
  for (const ch of row) {
    const last = cells[cells.length - 1];
    if (merge !== false && last) {
      if (ch === '」' && !last.sub && RE_PUNCT.test(last.main)) { last.sub = ch; last.kind = 'pair'; continue; }
      if (RE_PUNCT.test(ch) && !last.sub && cells.length >= cols) { last.sub = ch; last.kind = 'tail'; continue; }
    }
    cells.push({ main: ch });
  }
  return cells;
}
function cellEl(c, r, ci, opts) {
  const d = ce('div', 'gcell');
  d.dataset.r = r; d.dataset.c = ci;
  const m = c.main || '';
  if (m && m !== '　') {
    const s = ce('span', 'gc-main');
    s.textContent = m;
    d.appendChild(s);
    if (RE_PUNCT.test(m)) d.classList.add('k-punct');
    else if (RE_SMALL.test(m)) d.classList.add('k-small');
  }
  if (c.sub) {
    const s2 = ce('span', 'gc-sub');
    s2.textContent = c.sub;
    d.appendChild(s2);
  }
  if (c.kind === 'pair') d.classList.add('k-pair');
  if (c.kind === 'tail') d.classList.add('k-tail');
  if (opts.tapable) d.classList.add('tapable');
  return d;
}
/* げんこう用紙を つくる。opts.onCell(r,c,el) で マスの タップを うけとる */
function genkouEl(spec, opts) {
  opts = opts || {};
  const cols = spec.cols || 20;
  const rows = spec.rows || [];
  const nRows = Math.max(spec.minRows || 0, rows.length);
  const g = ce('div', 'genkou');
  g.dataset.chars = cols;        // 1行の 文字数（たてに ならぶ マスの数）
  g.dataset.lines = nRows;       // 行の数（右から 左へ ならぶ）
  g.style.setProperty('--chars', cols);
  g.style.setProperty('--lines', nRows);
  for (let r = 0; r < nRows; r++) {
    const cells = rowToCells(rows[r] || '', cols, spec.merge);
    if (cells.length > cols) cells.length = cols;   // 書きすぎ ぼうし
    while (cells.length < cols) cells.push({ main: '' });
    cells.forEach((c, ci) => g.appendChild(cellEl(c, r, ci, opts)));
  }
  if (opts.onCell) {
    g.addEventListener('click', (e) => {
      const t = e.target.closest ? e.target.closest('.gcell') : null;
      if (t && g.contains(t)) opts.onCell(+t.dataset.r, +t.dataset.c, t);
    });
  }
  return g;
}
function genkouWrap(spec, opts) {
  opts = opts || {};
  const w = ce('div', 'genkou-wrap' + (opts.big ? ' is-big' : '') + (opts.sample ? ' is-sample' : ''));
  w.appendChild(genkouEl(spec, opts));
  if (!opts.label) return w;
  /* 「お手本」などの 見出しを 上に つける */
  const box = ce('div', 'genkou-box');
  const lb = ce('p', 'genkou-label');
  lb.textContent = opts.label;
  box.appendChild(lb);
  box.appendChild(w);
  return box;
}
/* マスの 大きさを 計算する
   たて書きなので「よこ＝行の数」「たて＝1行の文字数」で 大きさが きまる。
   画面から はみ出さないように、たて・よこ 両方から 小さいほうを えらぶ。 */
function fitAllGenkou() {
  const vh = window.innerHeight || 800;
  document.querySelectorAll('.genkou').forEach(g => {
    const chars = +g.dataset.chars || 20;
    const lines = +g.dataset.lines || 1;
    const wrap = g.parentElement;
    const availW = ((wrap ? wrap.clientWidth : g.clientWidth) || 300) - 16;
    let maxH, maxCell;
    if (wrap && wrap.classList.contains('is-sample')) { maxH = Math.min(vh * 0.62, 640); maxCell = 34; }
    else if (g.closest('.ans'))                       { maxH = Math.min(vh * 0.34, 340); maxCell = 40; }
    else if (wrap && wrap.classList.contains('is-big')){ maxH = Math.min(vh * 0.40, 380); maxCell = 46; }
    else                                              { maxH = Math.min(vh * 0.40, 380); maxCell = 44; }
    const cell = Math.max(14, Math.min(maxCell, availW / lines, maxH / chars));
    g.style.setProperty('--cell', (Math.floor(cell * 10) / 10) + 'px');
  });
}
let fitTimer = null;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitAllGenkou, 80); });
window.addEventListener('orientationchange', () => setTimeout(fitAllGenkou, 250));

/* ========== 6. バトル ========== */
const battle = { world: null, qs: [], idx: 0, hp: 0, maxHp: 0, dmg: 10, first: 0, tries: 0, locked: false };

function startBattle(worldId) {
  const w = WORLDS.find(x => x.id === worldId);
  const qs = RULES.filter(r => r.world === worldId);
  if (!w || !qs.length) return;
  battle.world = w;
  battle.qs = qs;
  battle.idx = 0;
  battle.first = 0;
  battle.tries = 0;
  battle.dmg = 10;
  battle.maxHp = qs.length * battle.dmg;
  battle.hp = battle.maxHp;
  document.body.style.setProperty('--w', w.color);
  $('enemy-face').textContent = w.enemy.emoji;
  $('enemy-name').textContent = (w.boss ? '👑 ' : '') + w.enemy.name;
  $('hp-fill').style.width = '100%';
  hideVerdict();
  go('battle');
  renderQuestion();
}

function renderQuestion() {
  const q = battle.qs[battle.idx];
  battle.tries = 0;
  battle.locked = false;
  $('q-count').textContent = (battle.idx + 1) + 'もん目 / ' + battle.qs.length + 'もん';
  setTalk(q.question);
  const body = $('q-body');
  const ans = $('answers');
  body.innerHTML = '';
  ans.innerHTML = '';
  ans.className = 'answers';

  /* 見せる 作文（あれば） */
  if (q.statement) {
    const s = ce('div', 'statement');
    s.textContent = q.statement;
    body.appendChild(s);
  }
  if (q.manuscript && q.questionType !== 'find') {
    body.appendChild(genkouWrap(q.manuscript, { big: true, label: q.manuscriptLabel }));
  }

  (RENDER[q.questionType] || RENDER.choice)(q, body, ans);
  requestAnimationFrame(fitAllGenkou);
}
function setTalk(text) { $('q-text').textContent = text; }

/* ========== 7. もんだいの かたち べつ びょうが ========== */
const MARKS = ['A', 'B', 'C', 'D', 'E'];
const RENDER = {

  /* ①○×もんだい */
  ox(q, body, ans) {
    const wrap = ce('div', 'ox-wrap');
    [['○', true, 'o'], ['×', false, 'x']].forEach(([label, val, cls]) => {
      const b = ce('button', 'ox ' + cls);
      b.textContent = label;
      b.addEventListener('click', () => {
        if (battle.locked) return;
        if (val === q.answer) { judge(true, q); }
        else { b.classList.add('is-ng'); b.disabled = true; judge(false, q); }
      });
      wrap.appendChild(b);
    });
    ans.appendChild(wrap);
  },

  /* ②二たく・④えらぶ・⑥書きかえ（せんたく式） */
  choice(q, body, ans) {
    const oks = q.answers ? q.answers.slice() : [q.answer];
    const hasGenkou = q.choices.some(c => c.manuscript);
    if (hasGenkou) ans.className = 'answers two-col';
    q.choices.forEach((c, i) => {
      const b = ce('button', 'ans' + (c.manuscript ? ' ans-genkou' : ''));
      const mark = ce('span', 'ans-mark');
      mark.textContent = MARKS[i];
      b.appendChild(mark);
      if (c.manuscript) b.appendChild(genkouWrap(c.manuscript));
      else { const t = ce('span'); t.textContent = c.text; b.appendChild(t); }
      b.addEventListener('click', () => {
        if (battle.locked) return;
        if (oks.indexOf(i) >= 0) { b.classList.add('is-ok'); judge(true, q); }
        else { b.classList.add('is-ng', 'wrong-shake'); b.disabled = true; judge(false, q); }
      });
      ans.appendChild(b);
    });
  },
  rewrite(q, body, ans) { RENDER.choice(q, body, ans); },

  /* ③まちがいさがし（マスを タップ） */
  find(q, body, ans) {
    const need = q.answers.map(a => a.join(','));
    const found = {};
    const wrap = genkouWrap(q.manuscript, {
      big: true,
      tapable: true,
      onCell: (r, c, el) => {
        if (battle.locked) return;
        const key = r + ',' + c;
        if (found[key]) return;
        if (need.indexOf(key) >= 0) {
          found[key] = true;
          el.classList.add('hit');
          Sound.tap();
          const rest = need.length - Object.keys(found).length;
          if (rest === 0) judge(true, q);
          else flash('あと ' + rest + 'こ！', '');
        } else {
          el.classList.add('miss');
          setTimeout(() => el.classList.remove('miss'), 420);
          judge(false, q);
        }
      }
    });
    body.appendChild(wrap);
    const tip = ce('p', 'genkou-label');
    tip.textContent = 'マスを タップして えらぼう（右の行から 読むよ）';
    body.insertBefore(tip, wrap);
  },

  /* ④正しい ばしょを えらぶ（「、」を どこに 入れる？） */
  slot(q, body, ans) {
    const oks = q.answers ? q.answers.slice() : [q.answer];
    const line = ce('div', 'slot-sentence');
    q.parts.forEach((p, i) => {
      const sp = ce('span');
      sp.textContent = p;
      line.appendChild(sp);
      if (i < q.parts.length - 1) {
        const b = ce('button', 'slot-btn');
        b.textContent = '▽';
        b.addEventListener('click', () => {
          if (battle.locked) return;
          if (oks.indexOf(i) >= 0) {
            b.classList.add('is-ok');
            b.textContent = q.insert || '、';
            judge(true, q);
          } else {
            b.classList.add('is-ng');
            b.disabled = true;
            judge(false, q);
          }
        });
        line.appendChild(b);
      }
    });
    ans.appendChild(line);
  },

  /* ⑤ならべかえ */
  order(q, body, ans) {
    const picked = [];
    const slots = ce('div', 'order-slots');
    const btns = [];
    const draw = () => {
      slots.innerHTML = '';
      for (let i = 0; i < q.items.length; i++) {
        const s = ce('div', 'order-slot' + (picked[i] !== undefined ? ' is-filled' : ''));
        s.innerHTML = '<span class="order-num">' + (i + 1) + 'ばんめ</span>' +
                      (picked[i] !== undefined ? q.items[picked[i]] : '');
        slots.appendChild(s);
      }
    };
    q.items.forEach((text, i) => {
      const b = ce('button', 'ans');
      const mark = ce('span', 'ans-mark');
      mark.textContent = MARKS[i];
      b.appendChild(mark);
      const t = ce('span'); t.textContent = text; b.appendChild(t);
      b.addEventListener('click', () => {
        if (battle.locked || b.classList.contains('is-picked')) return;
        b.classList.add('is-picked');
        picked.push(i);
        Sound.tap();
        draw();
        if (picked.length === q.items.length) {
          const ok = picked.every((v, k) => v === q.answer[k]);
          if (ok) judge(true, q);
          else {
            judge(false, q);
            picked.length = 0;
            btns.forEach(x => x.classList.remove('is-picked'));
            draw();
          }
        }
      });
      btns.push(b);
      ans.appendChild(b);
    });
    draw();
    body.appendChild(slots);
  }
};

/* ========== 8. はんてい と えんしゅつ ========== */
function judge(ok, q) {
  if (battle.locked) return;
  if (!ok) {
    battle.tries++;
    Sound.ng();
    flash('おしい！', 'ng');
    setTalk('おしい！ ' + q.hint);
    return;
  }
  battle.locked = true;
  const first = battle.tries === 0;
  if (first) battle.first++;
  bumpCategory(q.category, first);
  addPower(1);
  Sound.ok();
  flash(first ? 'せいかい！' : 'できた！', '');
  hitEnemy(battle.dmg);
  setTimeout(() => showVerdict(q, first), 620);
}

function hitEnemy(dmg) {
  battle.hp = clamp(battle.hp - dmg, 0, battle.maxHp);
  $('hp-fill').style.width = (battle.hp / battle.maxHp * 100) + '%';
  const face = $('enemy-face');
  face.classList.remove('is-hit');
  void face.offsetWidth;
  face.classList.add('is-hit');
  const r = face.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  /* ダメージの すうじ */
  const d = ce('div', 'dmg');
  d.textContent = '-' + dmg;
  d.style.left = cx + 'px';
  d.style.top = cy + 'px';
  $('fx-layer').appendChild(d);
  setTimeout(() => d.remove(), 1000);
  /* キラキラ */
  for (let i = 0; i < 10; i++) {
    const s = ce('div', 'spark');
    s.textContent = ['✨', '⭐', '💫'][i % 3];
    s.style.left = (cx - 12 + (Math.random() * 60 - 30)) + 'px';
    s.style.top  = (cy - 12 + (Math.random() * 40 - 20)) + 'px';
    s.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
    s.style.setProperty('--dy', (-40 - Math.random() * 90) + 'px');
    s.style.setProperty('--rot', (Math.random() * 360 - 180) + 'deg');
    s.style.animationDelay = (i * 0.03) + 's';
    $('fx-layer').appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

let flashTimer = null;
function flash(text, cls) {
  const f = $('flash');
  $('flash-text').textContent = text;
  f.className = 'flash' + (cls ? ' ' + cls : '');
  f.hidden = false;
  void f.offsetWidth;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.hidden = true; }, 900);
}

/* こたえ合わせパネル */
function showVerdict(q, first) {
  $('verdict-title').textContent = first ? 'せいかい！' : 'できた！ ナイス。';
  $('verdict-rule').innerHTML =
    '<span style="color:var(--ok)">作文パワー +1！　' + battle.dmg + 'ダメージ！</span><br>' +
    '📘 ' + q.id + '　' + q.title;
  const cmp = $('verdict-compare');
  cmp.innerHTML = '';
  const box = (cls, tag, text) => {
    const b = ce('div', 'cmp-box ' + cls);
    const t = ce('div', 'cmp-tag'); t.textContent = tag;
    const x = ce('div', 'cmp-text'); x.textContent = text;
    b.appendChild(t); b.appendChild(x);
    return b;
  };
  const grid = ce('div', 'compare');
  grid.appendChild(box('ng', '✕ こうすると まちがい', q.wrongExample));
  grid.appendChild(box('ok', '◯ 正しい 書きかた', q.correctExample));
  cmp.appendChild(grid);
  $('verdict-exp').textContent = q.childExplanation +
    (q.anyOf ? '　※ 正かいは 一つだけでは ありません。' : '');
  $('verdict').hidden = false;
}
function hideVerdict() { $('verdict').hidden = true; }

function nextQuestion() {
  hideVerdict();
  battle.idx++;
  if (battle.idx >= battle.qs.length) { endBattle(); return; }
  renderQuestion();
}

/* ========== 9. バトルの おわり と けっか ========== */
function endBattle() {
  const w = battle.world;
  const total = battle.qs.length;
  const stars = starsFor(battle.first, total);
  const rec = save.worlds[w.id] || (save.worlds[w.id] = { cleared: false, stars: 0, first: 0, total: 0 });
  rec.cleared = true;
  rec.stars = Math.max(rec.stars || 0, stars);
  rec.first = battle.first;
  rec.total = total;
  persist();
  Sound.win();

  const allClear = WORLDS.every(x => (save.worlds[x.id] || {}).cleared);
  const body = $('result-body');
  body.innerHTML = '';

  const emo = ce('div', 'result-emoji');
  emo.textContent = w.boss ? '👑✨' : '🎉';
  const ttl = ce('div', 'result-title');
  ttl.textContent = w.boss ? 'マチガエール魔王を たおした！' : w.enemy.name + 'を たおした！';
  const st = ce('div', 'result-stars');
  st.textContent = starStr(stars);
  body.appendChild(emo); body.appendChild(ttl); body.appendChild(st);

  const panel = ce('div', 'result-panel');
  const row = (a, b) => {
    const r = ce('div', 'result-row');
    const x = ce('span'); x.textContent = a;
    const y = ce('span'); y.textContent = b;
    r.appendChild(x); r.appendChild(y);
    return r;
  };
  panel.appendChild(row('一回で 正かい', battle.first + ' / ' + total + 'もん'));
  panel.appendChild(row('もらった 作文パワー', '✨ ' + total));
  panel.appendChild(row('ぜんぶの 星', '⭐ ' + totalStars() + ' / ' + (WORLDS.length * 5)));
  body.appendChild(panel);

  const talk = ce('div', 'talk-bar');
  talk.innerHTML = '<span class="talk-face">🦉</span><p class="talk-text">' +
    (w.boss
      ? 'よく やりましたね！「すごかった」の 中みを 書けるように なりましたね。<br>つぎは、じぶんの 作文で ためして みましょう。'
      : (battle.first === total
          ? 'ぜんぶ 一回で 正かい！ すばらしい！'
          : 'まちがいを 見つけられた ことも、りっぱな 力ですよ。')) +
    '</p>';
  body.appendChild(talk);

  if (allClear) {
    const end = ce('div', 'result-panel');
    end.innerHTML = '<div style="text-align:center;font-weight:900;font-size:18px;line-height:1.9">' +
      '🏆 ぜんステージ クリア！<br>きみは <b>作文マスター</b> だ！<br>' +
      '<span style="font-size:14px;font-weight:700">つぎは、じぶんの 作文を「作文チェック」で 見なおして みよう。</span></div>';
    body.appendChild(end);
  }

  const btns = ce('div', 'result-btns');
  const mk = (label, cls, fn) => {
    const b = ce('button', 'btn' + (cls ? ' ' + cls : ''));
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  };
  btns.appendChild(mk('▶ べつの ステージへ', 'btn-main', () => go('map')));
  btns.appendChild(mk('🔁 もう一かい やる', '', () => startBattle(w.id)));
  btns.appendChild(mk('⭐ きろくを 見る', '', () => go('record')));
  body.appendChild(btns);

  go('result');
}

/* ========== 10. 作文チェックモード ========== */
function renderCheck() {
  const list = $('check-list');
  list.innerHTML = '';
  CHECK_ITEMS.forEach(item => {
    const rule = RULES.find(r => r.id === item.ruleId);
    const b = ce('button', 'check-item' + (save.check[item.id] ? ' is-on' : ''));
    const box = ce('span', 'check-box');
    box.textContent = '✓';
    const wrap = ce('span');
    const t = ce('div'); t.textContent = item.text;
    wrap.appendChild(t);
    if (rule) {
      const tip = ce('div', 'check-tip');
      tip.textContent = '🦉 ' + rule.title;
      wrap.appendChild(tip);
    }
    b.appendChild(box); b.appendChild(wrap);
    b.addEventListener('click', () => {
      save.check[item.id] = !save.check[item.id];
      b.classList.toggle('is-on', !!save.check[item.id]);
      persist();
      Sound.tap();
      updateCheckMeter();
      if (CHECK_ITEMS.every(i => save.check[i.id])) {
        Sound.win();
        flash('ぜんぶ できた！', '');
      }
    });
    list.appendChild(b);
  });
  updateCheckMeter();
}
/* お手本の げんこう用紙（20文字×10行）を 出す・かくす */
function toggleSample() {
  const box = $('sample-body');
  const show = box.hidden;
  if (show && !box.childElementCount) {
    const label = ce('p', 'genkou-label');
    label.textContent = 'だい名・名前・一マス空け・かい話文の お手本です';
    box.appendChild(label);
    box.appendChild(genkouWrap(SAMPLE_GENKOU, { sample: true }));
  }
  box.hidden = !show;
  $('btn-sample').textContent = show ? '📄 お手本の げんこう用紙を とじる　▲' : '📄 お手本の げんこう用紙を 見る　▼';
  if (show) requestAnimationFrame(fitAllGenkou);
}

function updateCheckMeter() {
  const done = CHECK_ITEMS.filter(i => save.check[i.id]).length;
  $('check-meter-fill').style.width = (done / CHECK_ITEMS.length * 100) + '%';
}

/* ========== 11. きろく（身につき度） ========== */
function renderRecord() {
  const body = $('record-body');
  body.innerHTML = '';

  const h1 = ce('h2'); h1.textContent = '⭐ 身につき度';
  body.appendChild(h1);
  const p1 = ce('div', 'rec-panel');
  Object.keys(CATEGORIES).forEach(key => {
    const c = CATEGORIES[key];
    const rec = save.categories[key] || { first: 0, total: 0 };
    const s = starsFor(rec.first, rec.total);
    const r = ce('div', 'rec-row');
    r.innerHTML =
      '<span class="rec-icon">' + c.emoji + '</span>' +
      '<span class="rec-label">' + c.label +
        '<div class="rec-sub">' + (rec.total ? '一回で正かい ' + rec.first + '/' + rec.total + 'もん' : 'まだ ちょうせん して いないよ') + '</div>' +
      '</span>' +
      '<span class="rec-stars">' + starStr(s) + '</span>';
    p1.appendChild(r);
  });
  body.appendChild(p1);

  const h2 = ce('h2'); h2.textContent = '🗺️ ステージの すすみぐあい';
  body.appendChild(h2);
  const p2 = ce('div', 'rec-panel');
  WORLDS.forEach(w => {
    const rec = save.worlds[w.id] || {};
    const r = ce('div', 'rec-row');
    r.innerHTML =
      '<span class="rec-icon">' + w.emoji + '</span>' +
      '<span class="rec-label">' + (w.plain || w.name) +
        '<div class="rec-sub">' + (rec.cleared ? 'クリア ずみ' : 'まだ クリアして いないよ') + '</div>' +
      '</span>' +
      '<span class="rec-stars">' + starStr(rec.stars || 0) + '</span>';
    p2.appendChild(r);
  });
  body.appendChild(p2);

  const tot = ce('p', 'rec-total');
  tot.textContent = '✨ 作文パワー ' + save.power + '　　⭐ 星 ' + totalStars() + ' / ' + (WORLDS.length * 5);
  body.appendChild(tot);
}

/* ========== 12. はじめの せってい ========== */
function boot() {
  $('power-num').textContent = save.power;
  $('btn-sound').textContent = save.sound ? '🔊' : '🔇';

  document.querySelectorAll('[data-go]').forEach(b => {
    b.addEventListener('click', () => { Sound.tap(); go(b.dataset.go); });
  });
  $('btn-back').addEventListener('click', () => { Sound.tap(); back(); });
  $('btn-next').addEventListener('click', () => { Sound.tap(); nextQuestion(); });
  $('btn-sound').addEventListener('click', () => {
    save.sound = !save.sound;
    $('btn-sound').textContent = save.sound ? '🔊' : '🔇';
    persist();
  });
  $('btn-sample').addEventListener('click', () => { Sound.tap(); toggleSample(); });
  $('btn-check-clear').addEventListener('click', () => {
    save.check = {};
    persist();
    renderCheck();
  });
  $('btn-reset').addEventListener('click', () => {
    if (confirm('きろくを ぜんぶ けして、さいしょから やりなおしますか？')) {
      save = blankSave();
      persist();
      $('power-num').textContent = 0;
      go('title');
    }
  });
  /* iPad は さいしょの タップで 音を つかえるように する */
  document.addEventListener('touchstart', () => Sound.init(), { once: true });
  document.addEventListener('click', () => Sound.init(), { once: true });

  go('title');
}
document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
